<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sightquest · Collection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{rootStyle}}">
<div style="padding: 8px 16px 0 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 4px">
<a href="{{backHref}}" aria-label="Back" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: var(--tx)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
<span style="font-size: 14px; font-weight: 600; color: var(--mu)">{{backLabel}}</span>
</div>
<div style="display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 20px; background: var(--sf); border: 1px solid var(--ln)">
<div style="width: 52px; height: 52px; border-radius: 16px; background: var(--sf2); flex: none; display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--act)">{{icon}}</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><h1 style="margin: 0; font-size: 22px; line-height: 1.15; font-weight: 800; font-stretch: 110%; white-space: nowrap">{{title}}</h1><span style="font-size: 14px; line-height: 1.4; color: var(--mu)">{{sub}}</span></div>
</div>
<div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px; scrollbar-width: none">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--mu)">{{countLabel}}</span>
</div>

<div style="padding: 10px 16px 0 16px; display: flex; flex-direction: column; gap: 18px">
<sc-for list="{{items}}" as="n" hint-placeholder-count="5">
<a href="Route.dc.html" style="display: flex; flex-direction: column; gap: 8px; color: var(--tx); text-decoration: none">
<div style="height: 150px; border-radius: 20px; background: {{n.ph}}; position: relative; overflow: hidden; border: 1px solid var(--ln)">
<svg viewBox="0 0 358 150" width="100%" height="150" preserveAspectRatio="none" style="position: absolute; inset: 0"><path d="{{n.path}}" fill="none" stroke-width="3" stroke-linecap="round" style="stroke: var(--rt)"></path></svg>
<span style="position: absolute; top: 10px; left: 10px; background: var(--scrim); font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; padding: 5px 9px; border-radius: 999px; color: {{n.chipColor}}">{{n.chip}}</span>
<span style="position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 999px; background: var(--scrim); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></span>
<sc-if value="{{n.hasNote}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 14px; background: var(--scrim)"><span style="width: 24px; height: 24px; border-radius: 999px; background: {{n.avatar}}; flex: none"></span><span style="font-size: 13px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.note}}</span></div></sc-if>
</div>
<div style="display: flex; justify-content: space-between; gap: 10px; align-items: baseline"><div style="font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.title}}</div><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--act); flex: none">{{n.eff}}</span></div>
<div style="margin-top: -6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--mu)">{{n.meta}}</div>
</a>
</sc-for>
</div>

<nav aria-label="Main" style="position: absolute; left: 12px; right: 12px; bottom: 12px; height: 60px; z-index: 5; border-radius: 999px; background: var(--sf); border: 1px solid var(--ln); display: flex; justify-content: space-evenly; align-items: center; padding: 0 14px; box-sizing: border-box">
<a href="Main.dc.html" aria-label="Explore" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--act)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 10a4.5 4.5 0 014.5-4.5h4a4.5 4.5 0 014.5 4.5v9a2 2 0 01-2 2h-9a2 2 0 01-2-2z"></path><path d="M9.5 5.5V4.5a2.5 2.5 0 015 0v1"></path><path d="M8.5 21v-4a1.5 1.5 0 011.5-1.5h4a1.5 1.5 0 011.5 1.5v4"></path></svg></a>
<a href="Search.dc.html" aria-label="Search" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--mu)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></a>
<a href="Create.dc.html" aria-label="Build a route" style="flex: none; width: 66px; height: 66px; border-radius: 999px; background: var(--ac); color: var(--on); box-shadow: 0 6px 18px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.04); display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><path d="M2.3 10.4c3.4-2.6 6.6 1.8 9.8-.6s5.8-2.8 9.6.2"></path><path d="M2.2 14c3.4-2.2 6.8 1.8 10.2-.3s5.4-2.1 9.4.4"></path><path d="M4.6 18c2.8-1.5 5.8 1.2 8.6-.2s4.2-1.3 6.4.2"></path><path d="M5.2 6.1c2.4-1 4.6.8 7-.2s3.6-1 6 .2"></path></svg></a>
<a href="Following.dc.html" aria-label="Friends" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--mu)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.8"></circle><ellipse cx="12" cy="12" rx="10" ry="4"></ellipse><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"></ellipse><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"></ellipse></svg></a>
<a href="Me.dc.html" aria-label="My profile" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--mu)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["november","gems","shared"],"default":"november"},"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { chip: 0 }; }
renderVals() {
var self = this;
var s = this.state;
var tok = '--bg: #131512; --sf: #1C1F1B; --sf2: #262A24; --ln: #31362F; --tx: #E6E8E1; --mu: #9CA295; --ac: #B9DE5C; --on: #131512; --act: #B9DE5C; --info: #8FB9E6; --map: #253126; --cnt: #34453A; --rt: #B9DE5C; --ph1: #3A4838; --ph2: #4A3F35; --ph3: #35434C; --ph4: #4A4652; --scrim: rgba(19,21,18,0.78); --ring: #000;';
var k = this.props.kind || 'november';
var paths = ['M20 120 C80 100 100 40 170 60 S260 110 340 30', 'M30 40 C90 60 120 120 190 100 S280 40 330 110', 'M20 80 C70 30 140 30 180 80 S280 130 340 70', 'M40 130 C80 90 110 110 150 70 S240 20 320 40', 'M20 60 C60 120 140 130 200 90 S300 20 340 90'];
var phs = ['var(--ph1)', 'var(--ph4)', 'var(--ph2)', 'var(--map)', 'var(--ph3)'];
var C = {
november: { icon: '☀', title: 'Best in November', sub: 'Dry, cool and clear. Creators went in November and loved the weather.', chips: ['All', 'Mountains', 'Cities', 'Islands'],
items: [['Yunnan tea trails', 'CHINA · NOV · 7D · $$ · @leafandlantern', '☀ DRY · 18°', '●●●○○'], ['Bagan by e-bike', 'MYANMAR · NOV · 4D · $ · @templerun', '☀ COOL MORNINGS · 22°', '●○○○○'], ['Chiang Mai loop', 'THAILAND · NOV · 5D · $ · @saltandsole', '☀ CLEAR · 24°', '●●○○○'], ['Northern Laos by moto', 'LAOS · NOV · 8D · $ · @twowheelsnorth', '☀ DRY · 20°', '●●●●○'], ['Rajasthan desert towns', 'INDIA · NOV · 10D · $$ · @dunedrifter', '☀ MILD · 26°', '●●○○○']] },
gems: { icon: '◆', title: 'Hidden gems', sub: 'Routes fewer than 30 people have done. Off-beat, but possible.', chips: ['All', 'Few have been', 'Hidden gem', 'Near me'],
items: [['Cao Bang waterfall road', 'VIETNAM · OCT · 4D · $ · @nomadgoblin', '12 HAVE BEEN', '●●●○○'], ['Siargao back roads', 'PHILIPPINES · APR · 5D · $$ · @islandhopper', '21 HAVE BEEN', '●●○○○'], ['Kampot pepper farms', 'CAMBODIA · JAN · 3D · $ · @slowroast', '9 HAVE BEEN', '●○○○○'], ['Flores overland', 'INDONESIA · JUL · 9D · $$ · @crater.kid', '17 HAVE BEEN', '●●●●○'], ['Sumba horse country', 'INDONESIA · AUG · 6D · $$$ · @sandalwood', '6 HAVE BEEN', '●●●○○']] },
shared: { icon: '↗', title: 'Shared with you', sub: 'Routes friends sent you, newest first.', chips: ['All', 'Unopened', 'From friends', 'From creators'],
items: [['Ha Giang, the long way', 'VIETNAM · MAR · 9D · $$ · @nomadgoblin', 'FROM @MAYA.GOES · 2H', '●●●○○', 'Maya: we HAVE to do this in March'], ['Laos by slow boat', 'LAOS · NOV · 3D · $ · @saltandsole', 'FROM @JUN.WALKS · 3D', '●○○○○', 'Jun: chill version of your Vietnam trip'], ['Penang hawker crawl', 'MALAYSIA · DEC · 2D · $ · @makanmapper', 'FROM @KELLYKAYAKS · 1W', '●○○○○', 'Kelly: long weekend??']] }
}[k];
var avs = ['var(--ph2)', 'var(--ph3)', 'var(--ph4)'];
return {
rootStyle: 'width: 390px; height: 1180px; position: relative; overflow: hidden; font-family: Archivo, sans-serif; background: var(--bg); color: var(--tx); ' + tok,
backHref: k === 'shared' ? 'Following.dc.html' : 'Main.dc.html', backLabel: k === 'shared' ? 'Friends' : 'Explore',
icon: C.icon, title: C.title, sub: C.sub,
countLabel: C.items.length + ' ROUTES',
chips: C.chips.map(function (l, i) { var on = s.chip === i; return { label: l, pick: function () { self.setState({ chip: i }); }, style: 'flex: none; height: 36px; padding: 0 14px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'border: 1px solid var(--ac); background: var(--ac); color: var(--on);' : 'border: 1px solid var(--ln); background: var(--sf); color: var(--tx);') }; }),
items: C.items.map(function (it, i) { return { title: it[0], meta: it[1], chip: it[2], eff: it[3], note: it[4] || '', hasNote: !!it[4], avatar: avs[i % 3], ph: phs[i % 5], path: paths[i % 5], chipColor: k === 'november' ? 'var(--act)' : 'var(--tx)' }; })
};
}
}
</script>
</body>
</html>
