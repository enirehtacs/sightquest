<div style="position: absolute; top: 12px; left: 12px; right: 12px; display: flex; align-items: center; gap: 8px">
<a href="Route.dc.html" aria-label="Back to route" style="flex: none; width: 44px; height: 44px; border-radius: 999px; background: var(--scrim); color: var(--tx); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="flex: 1; min-width: 0; padding: 6px 14px; border-radius: 999px; background: var(--scrim); display: flex; flex-direction: column">
<span style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Ha Giang, the long way</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--mu)">MAP DIARY · @nomadgoblin</span>
</div>
</div>

<div style="position: absolute; right: 12px; top: 76px; display: flex; flex-direction: column; gap: 8px">
<button type="button" aria-label="Zoom in" onClick="{{zoomIn}}" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--ln); background: var(--scrim); color: var(--tx); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
<button type="button" aria-label="Zoom out" onClick="{{zoomOut}}" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--ln); background: var(--scrim); color: var(--tx); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>
<button type="button" aria-label="Fit the whole route" onClick="{{fit}}" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--ln); background: var(--scrim); color: var(--act); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></button>
</div>

<sc-if value="{{overview}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); border-radius: 24px 24px 0 0; padding: 16px 16px 24px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -8px 24px rgba(0,0,0,0.25)">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 18px; font-weight: 800">Map diary</h2><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--mu)">12 MOMENTS · 6 PLACES</span></div>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: var(--mu)">Zoom into a place, or pick a place or a day, to read what happened.</p>
<div role="radiogroup" aria-label="Browse moments" style="align-self: flex-start; display: flex; gap: 2px; background: var(--sf2); border-radius: 999px; padding: 3px">
<sc-for list="{{byOpts}}" as="o" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.go}}" style="display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--ln); background: var(--sf); color: var(--tx); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{c.n}}<span style="min-width: 20px; height: 20px; border-radius: 999px; background: var(--ac); color: var(--on); font-family: 'JetBrains Mono', monospace; font-size: 11px; display: flex; align-items: center; justify-content: center">{{c.count}}</span></button>
</sc-for>
</div>
<button type="button" onClick="{{openReel}}" style="border: 0; font-family: inherit; cursor: pointer; margin-top: 2px; height: 46px; border-radius: 999px; background: var(--ac); color: var(--on); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"></path></svg>Replay the trip</button>
</div>
</sc-if>

<sc-if value="{{focused}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); border-radius: 24px 24px 0 0; padding: 14px 16px 22px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -8px 24px rgba(0,0,0,0.25)">
<div style="display: flex; align-items: center; gap: 10px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 18px; font-weight: 800; white-space: nowrap">{{placeName}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--mu)">{{placeMeta}}</span></div>
<button type="button" onClick="{{fit}}" style="height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--ln); background: var(--sf); color: var(--tx); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Whole route</button>
</div>
<sc-if value="{{isDay}}" hint-placeholder-val="{{ false }}">
<div role="radiogroup" aria-label="Pick a day" style="display: flex; gap: 6px; overflow: hidden">
<sc-for list="{{dayStrip}}" as="o" hint-placeholder-count="6">
<button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button>
</sc-for>
</div>
</sc-if>
<div style="border-radius: 18px; overflow: hidden; background: var(--sf); border: 1px solid var(--ln)">
<div style="{{photoStyle}}">
<span style="position: absolute; top: 10px; left: 10px; background: var(--scrim); color: var(--tx); font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; padding: 4px 8px; border-radius: 999px">{{tag}}</span>
<span style="position: absolute; top: 10px; right: 10px; background: var(--scrim); color: var(--tx); font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; padding: 4px 8px; border-radius: 999px">{{pos}}</span>
<span style="position: absolute; left: 10px; bottom: 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; color: var(--tx); opacity: 0.8">[PHOTO]</span>
</div>
<div style="padding: 10px 14px 12px 14px; display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: var(--act)">{{when}}</span>
<span style="font-size: 15px; line-height: 1.45">{{text}}</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" aria-label="Previous moment" onClick="{{prev}}" style="flex: none; width: 46px; height: 46px; border-radius: 999px; border: 1px solid var(--ln); background: var(--sf); color: var(--tx); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="flex: 1; display: flex; justify-content: center; gap: 6px">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="3"><span style="{{d.style}}"></span></sc-for>
</div>
<button type="button" onClick="{{next}}" style="flex: none; height: 46px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--ac); color: var(--on); font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px">{{nextLabel}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
</div>
</sc-if>
<sc-if value="{{reel}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0">
<dc-import name="Playback" trip="hagiang" embedded="true" on-close="{{closeReel}}" hint-size="390px,844px"></dc-import>
</div>
</sc-if>
</div>
</x-dc>
