<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sightquest · Must-know</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{rootStyle}}">
<div style="padding: 8px 16px 110px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 4px">
<a href="Live.dc.html" aria-label="Back to your route" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: var(--tx)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="flex: 1; margin: 0; font-size: 22px; line-height: 1.2; font-weight: 800; font-stretch: 110%; white-space: nowrap">Must-know</h1>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: var(--mu)">The stuff people always ask before they go. Tap an answer, add a line if you want. Skip anything you don't know.</p>
<div style="display: flex; align-items: center; gap: 10px"><div style="flex: 1; height: 6px; border-radius: 999px; background: var(--sf2); overflow: hidden"><div style="{{barStyle}}"></div></div><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--act)">{{filled}} OF {{total}}</span></div>

<sc-for list="{{cats}}" as="c" hint-placeholder-count="11">
<div style="{{c.card}}">
<button type="button" onClick="{{c.open}}" aria-expanded="{{c.expanded}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 0 14px; border: 0; background: transparent; color: var(--tx); font-family: inherit; text-align: left; cursor: pointer">
<span style="width: 30px; height: 30px; border-radius: 10px; background: var(--sf2); color: var(--act); display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{c.i}}"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 700">{{c.name}}</span><span style="font-size: 12px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.summary}}</span></span>
<span style="{{c.dot}}">{{c.mark}}</span>
</button>
<sc-if value="{{c.isOpen}}" hint-placeholder-val="{{ false }}">
<div style="padding: 0 14px 14px 14px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; color: var(--mu)">{{c.q}}</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{c.opts}}" as="o" hint-placeholder-count="4">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button>
</sc-for>
</div>
<input aria-label="{{c.name}} note" value="{{c.note}}" placeholder="{{c.ph}}" style="height: 44px; border-radius: 14px; border: 1px solid var(--ln); background: var(--bg); padding: 0 14px; font-family: inherit; font-size: 14px; color: var(--tx)">
</div>
</sc-if>
</div>
</sc-for>

<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.4px; color: var(--mu); margin-top: 8px">YOUR OWN</span>
<sc-for list="{{custom}}" as="u" hint-placeholder-count="1">
<div style="background: var(--sf); border: 1px solid var(--ln); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<input aria-label="Category name" value="{{u.name}}" style="height: 40px; border-radius: 12px; border: 1px solid var(--ln); background: var(--bg); padding: 0 12px; font-family: inherit; font-size: 15px; font-weight: 700; color: var(--tx)">
<input aria-label="What people should know" value="{{u.note}}" style="height: 40px; border-radius: 12px; border: 1px solid var(--ln); background: var(--bg); padding: 0 12px; font-family: inherit; font-size: 14px; color: var(--tx)">
</div>
</sc-for>
<button type="button" onClick="{{addCustom}}" style="height: 48px; border-radius: 16px; border: 1px dashed var(--ln); background: transparent; color: var(--act); font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">+ Add your own (e.g. COVID rules, festival closures)</button>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 24px 16px; background: var(--bg); border-top: 1px solid var(--ln)">
<a href="Live.dc.html" style="height: 50px; border-radius: 999px; background: var(--ac); color: var(--on); text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Save must-know</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1360}}'>

}
</script>
</body>
</html>
