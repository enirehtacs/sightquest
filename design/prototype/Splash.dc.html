<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sightquest · Welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{rootStyle}}">
<div style="position: absolute; top: 64px; left: 25px; width: 340px; height: 340px">
<svg viewBox="-20 -20 340 340" width="340" height="340" overflow="visible" role="img" aria-label="Spinning globe covered in contour lines">
<circle cx="150" cy="150" r="146" fill="none" stroke-width="22" style="stroke: var(--rt); opacity: 0.07"></circle>
<circle cx="150" cy="150" r="130" style="fill: var(--globe)"></circle>
<path d="{{grat}}" fill="none" stroke-width="0.8" style="stroke: var(--grat)"></path>
<path d="{{contours}}" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--rt); opacity: 0.08"></path>
<path d="{{contours}}" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--rt); opacity: 0.55"></path>
<path d="{{cores}}" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--rt); opacity: 0.18"></path>
<path d="{{cores}}" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--rt)"></path>
<circle cx="150" cy="150" r="130" fill="none" stroke-width="1.5" style="stroke: var(--rt); opacity: 0.45"></circle>
</svg>
</div>

<div style="position: absolute; top: 418px; left: 16px; right: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<h1 style="margin: 0; font-size: 36px; line-height: 1.1; font-weight: 800; font-stretch: 110%; white-space: nowrap">Sightquest</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.45; color: var(--mu)">Find routes. Share yours.<br>Get a little lost.</p>
</div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 30px; display: flex; flex-direction: column; gap: 10px">
<a href="Welcome.dc.html" style="height: 48px; border-radius: 999px; background: var(--tx); color: var(--bg); text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Continue with Apple</a>
<a href="Welcome.dc.html" style="height: 48px; border-radius: 999px; background: var(--sf); border: 1px solid var(--ln); box-sizing: border-box; color: var(--tx); text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Continue with Google</a>
<a href="Welcome.dc.html" style="height: 48px; border-radius: 999px; background: var(--ac); color: var(--on); text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Sign up with email</a>
<a href="Main.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; color: var(--mu); text-decoration: none; font-size: 14px">Already exploring? <span style="margin-left: 4px; color: var(--act); font-weight: 700">Log in</span></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"spin":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { a: 0.6 };
var D = Math.PI / 180;
var journeys = [[-170, 20, 170, 14, 2.2, 0.3], [-60, -22, 160, 12, 2.8, 1.1], [40, 38, 150, 9, 2.4, 2.4], [120, -36, 170, 15, 1.8, 0.7], [-125, 56, 130, 7, 3.2, 1.9]];
var lines = [];
var cores = [];
function rough(u, k, ph) { return 0.9 * Math.sin(23 * u * Math.PI + ph + k) + 0.6 * Math.sin(41 * u * Math.PI + ph * 3 + k * 2) + 0.35 * Math.sin(67 * u * Math.PI + k * 5); }
journeys.forEach(function (j) {
var N = 120;
function cl(u) { return [j[1] + j[3] * Math.sin(j[4] * u * Math.PI + j[5]) + 3.5 * Math.sin(6 * u * Math.PI + j[5] * 2) + 1.2 * Math.sin(15 * u * Math.PI + j[5]), j[0] + j[2] * u]; }
var core = [];
for (var k = 0; k <= N; k++) { var u = k / N; var c = cl(u); core.push([(c[0] + 0.5 * rough(u, 9, j[5])) * D, c[1] * D]); }
cores.push(core);
[3, 6, 9, 12].forEach(function (r, ri) {
function w(u) { return r * (0.55 + 0.45 * Math.sin(Math.PI * u)) * (1 + 0.25 * Math.sin(4 * u * Math.PI + ri + j[5])); }
var loop = [];
var k1, u1, c1;
for (k1 = 0; k1 <= N; k1++) { u1 = k1 / N; c1 = cl(u1); loop.push([(c1[0] + w(u1) + 0.55 * rough(u1, ri, j[5])) * D, c1[1] * D]); }
var ce = cl(1), we = w(1);
for (var a = 1; a < 12; a++) { var th = Math.PI / 2 - a * Math.PI / 12; loop.push([(ce[0] + we * Math.sin(th)) * D, (ce[1] + we * 0.9 * Math.cos(th)) * D]); }
for (k1 = N; k1 >= 0; k1--) { u1 = k1 / N; c1 = cl(u1); loop.push([(c1[0] - w(u1) + 0.55 * rough(u1, ri + 3, j[5])) * D, c1[1] * D]); }
var cs = cl(0), ws = w(0);
for (var b = 1; b <= 12; b++) { var th2 = -Math.PI / 2 - b * Math.PI / 12; loop.push([(cs[0] + ws * Math.sin(th2)) * D, (cs[1] + ws * 0.9 * Math.cos(th2)) * D]); }
lines.push(loop);
});
});
this.cores = cores;
var grat = [];
for (var la = -60; la <= 60; la += 30) {
var p = [];
for (var lo = 0; lo <= 360; lo += 6) p.push([la * D, lo * D]);
grat.push(p);
}
for (var lo2 = 0; lo2 < 180; lo2 += 30) {
var q = [];
for (var la2 = 0; la2 <= 360; la2 += 6) q.push([Math.sin(la2 * D) > 2 ? 0 : Math.asin(Math.sin(la2 * D)), lo2 * D + (Math.cos(la2 * D) < 0 ? Math.PI : 0)]);
grat.push(q);
}
this.lines = lines;
this.gratLines = grat;
}
componentDidMount() {
var self = this;
var last = 0;
function tick(now) {
if (self.props.spin !== false && now - last > 33) {
var dt = last ? Math.min(now - last, 100) : 33;
last = now;
self.setState({ a: (self.state.a + dt * 0.00022) % (Math.PI * 2) });
}
self.raf = requestAnimationFrame(tick);
}
this.raf = requestAnimationFrame(tick);
}
componentWillUnmount() {
cancelAnimationFrame(this.raf);
}
path(lines) {
var a = this.state.a, tilt = 0.38, R = 130, c = 150;
var ct = Math.cos(tilt), st = Math.sin(tilt);
var out = '';
lines.forEach(function (pts) {
var pen = false;
pts.forEach(function (p) {
var lam = p[1] + a;
var x = Math.cos(p[0]) * Math.sin(lam);
var y0 = Math.sin(p[0]);
var z0 = Math.cos(p[0]) * Math.cos(lam);
var y = y0 * ct - z0 * st;
var z = y0 * st + z0 * ct;
if (z > 0) {
out += (pen ? 'L' : 'M') + (c + R * x).toFixed(1) + ' ' + (c - R * y).toFixed(1);
pen = true;
} else {
pen = false;
}
});
});
return out || 'M0 0';
}
renderVals() {
var T = {
dark: '--bg: #131512; --sf: #1C1F1B; --ln: #31362F; --tx: #E6E8E1; --mu: #9CA295; --ac: #B9DE5C; --on: #131512; --act: #B9DE5C; --rt: #B9DE5C; --globe: #182019; --grat: #2A3529;',
light: '--bg: #F3F2EC; --sf: #FFFFFF; --ln: #DCDBD2; --tx: #1B1D19; --mu: #5D6257; --ac: #C6E86E; --on: #1B1D19; --act: #4F7212; --rt: #5E8A0F; --globe: #E6EDDD; --grat: #CBD6C0;'
};
var t = this.props.theme === 'light' ? 'light' : 'dark';
return {
rootStyle: 'width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Archivo, sans-serif; background: var(--bg); color: var(--tx); ' + T[t],
grat: this.path(this.gratLines),
contours: this.path(this.lines),
cores: this.path(this.cores)
};
}
}
</script>
</body>
</html>
