<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sightquest · Subscription</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{rootStyle}}">
<div style="padding: 8px 16px 24px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 4px">
<a href="Settings.dc.html" aria-label="Back to settings" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: var(--tx)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; line-height: 1.2; font-weight: 800; font-stretch: 110%">Subscription</h1>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.4px; color: var(--mu); padding-left: 4px">YOUR PLAN</span>
<div style="background: var(--sf); border: 1px solid var(--act); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px"><span style="font-size: 17px; font-weight: 800">{{planName}}</span><span style="{{badgeStyle}}">{{badge}}</span></div>
<span style="font-size: 14px; line-height: 1.45; color: var(--mu)">{{planLine}}</span>
<sc-if value="{{isTrial}}" hint-placeholder-val="{{ true }}"><div style="height: 6px; border-radius: 999px; background: var(--sf2); overflow: hidden"><div style="width: 23%; height: 100%; background: var(--ac)"></div></div></sc-if>
<a href="Pro.dc.html" style="{{ctaStyle}}">{{planCta}}</a>
</div>
<div style="display: flex; flex-direction: column; background: var(--sf); border: 1px solid var(--ln); border-radius: 16px; overflow: hidden">
<sc-for list="{{subRows}}" as="r" hint-placeholder-count="4">
<button type="button" onClick="{{r.go}}" style="{{r.style}}">
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px; padding: 8px 0"><span style="{{r.labelStyle}}">{{r.label}}</span><sc-if value="{{r.hasSub}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; line-height: 1.35; color: var(--mu)">{{r.sub}}</span></sc-if></span>
<span style="font-size: 14px; color: var(--mu); white-space: nowrap">{{r.value}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--mu); flex: none"><path d="M9 5l7 7-7 7"></path></svg>
</button>
</sc-for>
</div>
</div>

<span style="font-size: 12px; line-height: 1.45; color: var(--mu); padding: 0 4px">Billed through your Apple account. Cancelling keeps Pro on until the end of what you've paid for. Linking posts to whole routes is always free.</span>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"plan":{"editor":"enum","options":["trial","pro","free"],"default":"trial"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = {
on: { delay: true, blur: true, home: true, dates: false, nRoutes: true, nChecks: true, nRemix: true, nBadge: true },
seg: { appearance: props.theme === 'light' ? 'Light' : 'System', units: 'km' }
};
}
renderVals() {
var self = this;
var s = this.state;
var T = {
dark: '--bg: #131512; --sf: #1C1F1B; --sf2: #262A24; --ln: #31362F; --tx: #E6E8E1; --mu: #9CA295; --ac: #B9DE5C; --on: #131512; --act: #B9DE5C; --danger: #F08A7E;',
light: '--bg: #F3F2EC; --sf: #FFFFFF; --sf2: #E9E8E1; --ln: #DCDBD2; --tx: #1B1D19; --mu: #5D6257; --ac: #C6E86E; --on: #1B1D19; --act: #4F7212; --danger: #B3261E;'
};
var t = this.props.theme === 'light' ? 'light' : 'dark';
function link(label, value, sub) { return { isLink: true, label: label, value: value || '', sub: sub || '', hasSub: !!sub, labelStyle: 'font-size: 15px;' }; }
function sw(key, label, sub) {
var on = !!s.on[key];
return {
isSwitch: true, label: label, sub: sub || '', hasSub: !!sub, checked: on ? 'true' : 'false',
track: 'flex: none; width: 46px; height: 28px; border-radius: 999px; padding: 3px; box-sizing: border-box; display: flex; background: ' + (on ? 'var(--ac)' : 'var(--sf2)') + '; justify-content: ' + (on ? 'flex-end' : 'flex-start') + ';',
knob: 'width: 22px; height: 22px; border-radius: 999px; background: ' + (on ? 'var(--on)' : 'var(--mu)') + ';',
toggle: function () { var n = Object.assign({}, s.on); n[key] = !on; self.setState({ on: n }); }
};
}
function seg(key, label, opts) {
return {
isSeg: true, label: label,
opts: opts.map(function (o) {
var on = s.seg[key] === o;
return { label: o, checked: on ? 'true' : 'false', style: 'min-height: 36px; min-width: 44px; padding: 0 12px; border: 0; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ' + (on ? 'background: var(--tx); color: var(--bg);' : 'background: transparent; color: var(--mu);'), pick: function () { var n = Object.assign({}, s.seg); n[key] = o; self.setState({ seg: n }); } };
})
};
}
var groups = [
{ title: 'PROFILE & SIGN-IN', rows: [link('Edit profile', '', 'Photo, name, bio, home base'), link('Username', '@vivi.wanders'), link('Email', 'Verified'), link('Sign-in', 'Apple'), link('Connected apps', 'Strava, GPX')] },
{ title: 'PRIVACY & SAFETY', rows: [link('Location access', 'While using', 'For nearby routes and your spot on the map. Never shown to others.'), link('New live routes start as', 'Only me'), sw('delay', 'Share live days 24h late', 'People see yesterday, never today'), sw('blur', 'Blur where I sleep', 'Overnight stops show as a 2 km area'), sw('home', 'Hide my home city', 'Your profile shows the country only'), link('Who can message me', 'People I follow'), link('Blocked accounts', '0')] },
{ title: 'PREFERENCES', rows: [seg('appearance', 'Appearance', ['System', 'Dark', 'Light']), seg('units', 'Distance', ['km', 'mi']), link('Exact trip dates', 'Only me', 'Others see the month you went, and Day 1, Day 2…')] },
{ title: 'NOTIFICATIONS', rows: [sw('nRoutes', 'New routes from people I follow'), sw('nChecks', 'Fresh checks on my routes'), sw('nRemix', 'Someone remixes my route'), sw('nBadge', 'Badge unlocked')] },
{ title: 'YOUR DATA', rows: [link('Export routes as GPX'), link('Download my data')] },
{ title: 'HELP', rows: [link('Help centre'), link('Community guidelines'), link('Report a safety concern')] }
];
groups.forEach(function (g) {
g.rows.forEach(function (r, i) {
r.isLink = !!r.isLink; r.isSwitch = !!r.isSwitch; r.isSeg = !!r.isSeg;
r.rowStyle = i < g.rows.length - 1 ? 'border-bottom: 1px solid var(--ln);' : '';
if (!r.opts) r.opts = [];
if (r.labelStyle === undefined) r.labelStyle = 'font-size: 15px;';
if (r.value === undefined) r.value = '';
if (r.sub === undefined) { r.sub = ''; r.hasSub = false; }
});
});
var plan = this.props.plan || 'trial';
var P = {
trial: { name: 'Sightquest Pro', badge: 'FREE TRIAL', line: '23 days left. Then S$47.98 a year from 3 Nov 2026. Cancel before then and you pay nothing.', cta: 'Change plan' },
pro: { name: 'Sightquest Pro', badge: 'YEARLY', line: 'S$47.98 a year. Renews 3 Nov 2027 from your Apple account.', cta: 'Change plan' },
free: { name: 'Free plan', badge: 'FREE', line: 'Link posts to whole routes. Go Pro to link posts to each day.', cta: 'Try Pro free for 1 month' }
}[plan];
var subDefs = plan === 'free'
? [['Promo code', 'Enter code', ''], ['Offers', '1 available', '20% off your first year'], ['Restore purchases', '', 'Bought Pro on another phone?']]
: [['Billing', 'Apple', 'Receipts and payment method'], ['Promo code', 'Enter code', ''], ['Offers', '1 available', 'Switch to yearly, save 33%'], ['Restore purchases', '', 'Bought Pro on another phone?'], [plan === 'trial' ? 'Cancel free trial' : 'Cancel subscription', '', plan === 'trial' ? 'Pro stays on until the trial ends' : 'Pro stays on until 3 Nov 2027']];
var subRows = subDefs.map(function (d, i) { var danger = /^Cancel/.test(d[0]); return { label: d[0], value: d[1], sub: d[2], hasSub: !!d[2], labelStyle: 'font-size: 15px; color: ' + (danger ? 'var(--danger)' : 'var(--tx)') + ';', go: function () {}, style: 'display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 0 14px; border: 0; background: transparent; color: var(--tx); font-family: inherit; text-align: left; cursor: pointer; ' + (i < subDefs.length - 1 ? 'border-bottom: 1px solid var(--ln);' : '') }; });
return {
planName: P.name, badge: P.badge, planLine: P.line, planCta: P.cta, isTrial: plan === 'trial', subRows: subRows,
badgeStyle: "font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; padding: 4px 8px; border-radius: 999px; " + (plan === 'free' ? 'background: var(--sf2); color: var(--mu);' : 'background: var(--ac); color: var(--on);'),
ctaStyle: 'height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; font-weight: 700; ' + (plan === 'free' ? 'background: var(--ac); color: var(--on);' : 'background: var(--sf2); color: var(--tx);'),
rootStyle: 'width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Archivo, sans-serif; background: var(--bg); color: var(--tx); ' + T[t],
groups: groups
};
}
}
</script>
</body>
</html>
