<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sightquest · 2026 Unpacked</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{rootStyle}}">
<div onClick="{{next}}" style="{{bg}}">
<svg viewBox="0 0 390 844" width="390" height="844" style="position: absolute; inset: 0; pointer-events: none" aria-hidden="true"><g fill="none" stroke="#B9DE5C" stroke-opacity=".12" stroke-width="1.4"><path d="M-20 160 C80 120 160 220 260 170 S400 140 420 170"></path><path d="M-20 300 C90 260 170 360 270 310 S400 280 420 310"></path><path d="M-20 640 C80 600 170 700 270 650 S400 620 420 650"></path><path d="M-20 760 C90 730 180 810 280 770 S400 740 420 770"></path></g></svg>
<div style="position: absolute; left: 12px; right: 12px; top: 12px; display: flex; gap: 4px; z-index: 2">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="7"><span style="{{b.style}}"></span></sc-for>
</div>
<div style="position: absolute; left: 16px; right: 16px; top: 28px; display: flex; align-items: center; justify-content: space-between; z-index: 2">
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; font-stretch: 110%"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" style="stroke: var(--act)"><circle cx="12" cy="12" r="10"></circle><path d="M2.3 10.4c3.4-2.6 6.6 1.8 9.8-.6s5.8-2.8 9.6.2"></path><path d="M2.2 14c3.4-2.2 6.8 1.8 10.2-.3s5.4-2.1 9.4.4"></path><path d="M4.6 18c2.8-1.5 5.8 1.2 8.6-.2s4.2-1.3 6.4.2"></path></svg>2026 Unpacked</span>
<a href="Me.dc.html" aria-label="Close" style="width: 40px; height: 40px; margin-right: -8px; display: flex; align-items: center; justify-content: center; color: var(--tx); font-size: 18px; text-decoration: none">✕</a>
</div>

<div style="position: absolute; left: 24px; right: 24px; top: 150px; bottom: 150px; display: flex; flex-direction: column; justify-content: center; gap: 16px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; color: var(--act); letter-spacing: .5px">{{kicker}}</span>
<span style="font-size: {{bigFs}}px; font-weight: 900; font-stretch: 115%; line-height: .95; letter-spacing: -1px">{{big}}</span>
<span style="font-size: 22px; font-weight: 700; line-height: 1.25">{{line}}</span>
<span style="font-size: 15px; line-height: 1.5; color: var(--mu)">{{sub}}</span>
<sc-if value="{{hasList}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px">
<sc-for list="{{list}}" as="l" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.05); border: 1px solid var(--ln)"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--act); width: 18px">{{l.n}}</span><span style="flex: 1; font-size: 15px; font-weight: 600">{{l.t}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--mu)">{{l.v}}</span></div>
</sc-for>
</div>
</sc-if>
</div>

<sc-if value="{{isLast}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 16px; right: 16px; bottom: 40px; display: flex; flex-direction: column; gap: 10px; z-index: 2">
<a href="ShareAtlas.dc.html" style="height: 50px; border-radius: 999px; background: var(--ac); color: var(--on); text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Share my 2026</a>
<button type="button" onClick="{{restart}}" style="height: 44px; border-radius: 999px; border: 1px solid var(--ln); background: transparent; color: var(--tx); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Watch again</button>
</div>
</sc-if>
<sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
<span style="position: absolute; left: 0; right: 0; bottom: 40px; text-align: center; font-size: 12px; color: var(--mu)">Tap to keep going</span>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"slide":{"editor":"enum","options":["0","1","2","3","4","5","6"],"default":"0"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { i: props.slide ? +props.slide : 0 }; }
renderVals() {
var self = this;
var s = this.state;
var P = this.props;
function chip(on) { return 'min-height: 40px; padding: 0 14px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'border: 1px solid var(--ac); background: var(--ac); color: var(--on);' : 'border: 1px solid var(--ln); background: var(--sf); color: var(--tx);'); }
var V = {};

var S = [
{ k: 'YOUR YEAR ON SIGHTQUEST', b: '2026', l: 'You went and did things.', s: 'Let\'s unpack it. Tap through.', bg: '#1C241B' },
{ k: 'YOU COVERED', b: '6,412 km', l: 'Across 9 countries and 14 routes.', s: 'That\'s Singapore to Kathmandu, roughly. On mostly buses and one questionable moto.', bg: '#1B2229' },
{ k: 'HOW YOU GOT AROUND', b: 'Bus', l: 'Your ride of the year.', s: '', bg: '#231F1B', list: [['1', 'Bus', '41 legs'], ['2', 'Moto', '23 legs'], ['3', 'Night train', '6 legs']] },
{ k: 'LONGEST DAY', b: '14h', l: 'Hue → Phong Nha, Day 17.', s: 'Two buses, one breakdown, a noodle stop that saved your life.', bg: '#1E1B24' },
{ k: 'MOST CHAOTIC MOMENT', b: '"Rice wine roulette"', l: 'Dong Van, Day 4. 31 people saved it.', s: 'Your most-loved moment of the year.', bg: '#24201A' },
{ k: 'YOUR ROUTES TRAVELLED', b: '23 steals', l: 'People took your routes and made them theirs.', s: 'Vietnam, south to north got stolen the most. 4 of them went in the same month you did.', bg: '#1B241F' },
{ k: 'ON REPEAT', b: '♪', l: 'Ha Giang on two wheels', s: 'Your Trip tunes, opened 212 times by other people.', bg: '#1C1F26', list: [['★', '3 sidequests joined', ''], ['◆', '11 badges', '4 new'], ['✓', 'SOWO approved route', '1']] }
];
var i = Math.min(s.i, S.length - 1), c = S[i];
V.kicker = c.k; V.big = c.b; V.line = c.l; V.sub = c.s;
V.bigFs = c.b.length > 10 ? 48 : 84;
V.hasList = !!c.list; V.list = (c.list || []).map(function (x) { return { n: x[0], t: x[1], v: x[2] }; });
V.isLast = i === S.length - 1; V.notLast = !V.isLast;
V.bars = S.map(function (_, j) { return { style: 'flex: 1; height: 3px; border-radius: 999px; background: ' + (j <= i ? 'var(--tx)' : 'rgba(255,255,255,.2)') + ';' }; });
V.next = function () { if (i < S.length - 1) self.setState({ i: i + 1 }); };
V.restart = function (e) { if (e && e.stopPropagation) e.stopPropagation(); self.setState({ i: 0 }); };
V.bg = 'position: absolute; inset: 0; cursor: pointer; transition: background .4s ease; background: radial-gradient(120% 80% at 20% 10%, ' + c.bg + ' 0%, #0E100D 70%);';

V.rootStyle = 'width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Archivo, sans-serif; background: var(--bg); color: var(--tx); --bg: #131512; --sf: #1C1F1B; --sf2: #262A24; --ln: #31362F; --tx: #E6E8E1; --mu: #9CA295; --ac: #B9DE5C; --on: #131512; --act: #B9DE5C; --info: #8FB9E6; --warn: #F0B45A; --danger: #F08A7E; --map: #253126; --cnt: #34453A; --rt: #B9DE5C; --ph1: #3A4838; --ph2: #4A3F35; --ph3: #35434C; --ph4: #4A4652; --scrim: rgba(19,21,18,0.78); --ring: #000;';
return V;
}
}
</script>
</body>
</html>
