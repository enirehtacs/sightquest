<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sightquest · Welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{rootStyle}}">
<div onPointerDown="{{swDown}}" onPointerUp="{{swUp}}" style="position: absolute; inset: 0; touch-action: pan-y">
<div style="position: absolute; left: 16px; right: 16px; top: 14px; display: flex; justify-content: space-between; align-items: center">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: var(--mu)">{{step}}</span>
<a href="Pledge.dc.html" style="font-size: 14px; font-weight: 600; color: var(--mu); text-decoration: none; padding: 10px 0">Skip</a>
</div>
<div style="position: absolute; left: 0; right: 0; top: 90px; display: flex; justify-content: center">
<sc-if value="{{s0}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 300 220" width="300" height="220"><g fill="none" stroke="#34453A" stroke-width="1.4"><path d="M-10 60 C60 30 120 90 190 50 S300 40 320 60"></path><path d="M-10 120 C70 90 140 150 210 110 S300 100 320 120"></path><path d="M-10 180 C60 160 140 210 220 170 S300 160 320 180"></path></g><path d="M40 180 C80 150 90 100 140 106 S180 150 210 120 S240 50 268 40" fill="none" stroke="#B9DE5C" stroke-width="5" stroke-linecap="round"></path><circle cx="40" cy="180" r="9" fill="#E6E8E1" stroke="#000" stroke-width="3"></circle><circle cx="140" cy="106" r="7" fill="#E6E8E1" stroke="#000" stroke-width="3"></circle><circle cx="268" cy="40" r="10" fill="#B9DE5C" stroke="#000" stroke-width="3"></circle></svg></sc-if>
<sc-if value="{{s1}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 300 220" width="300" height="220"><g fill="#1C1F1B" stroke="#31362F" stroke-width="2"><rect x="40" y="30" width="220" height="44" rx="12"></rect><rect x="40" y="88" width="220" height="44" rx="12"></rect><rect x="40" y="146" width="220" height="44" rx="12" stroke="#B9DE5C" stroke-dasharray="6 6"></rect></g><g font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#9CA295"><text x="58" y="57">DAY 1</text><text x="58" y="115">DAY 2</text><text x="58" y="173" fill="#B9DE5C">+ NEXT DAY</text></g><g fill="#3A4838"><rect x="196" y="38" width="28" height="28" rx="6"></rect><rect x="228" y="38" width="22" height="28" rx="6" fill="#4A3F35"></rect><rect x="210" y="96" width="40" height="28" rx="6" fill="#35434C"></rect></g></svg></sc-if>
<sc-if value="{{s2}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 300 220" width="300" height="220"><g><rect x="30" y="34" width="190" height="56" rx="16" fill="#1C1F1B" stroke="#31362F" stroke-width="2"></rect><rect x="80" y="104" width="190" height="56" rx="16" fill="#26301F" stroke="#B9DE5C" stroke-width="2"></rect><circle cx="58" cy="62" r="12" fill="#35434C"></circle><circle cx="248" cy="132" r="12" fill="#4A3F35"></circle><rect x="80" y="54" width="120" height="7" rx="3" fill="#9CA295"></rect><rect x="80" y="68" width="80" height="7" rx="3" fill="#31362F"></rect><rect x="100" y="124" width="120" height="7" rx="3" fill="#E6E8E1"></rect><rect x="100" y="138" width="90" height="7" rx="3" fill="#9CA295"></rect></g><path d="M150 186 l8 -8 a6 6 0 0 0 -8 -8 a6 6 0 0 0 -8 8z" fill="#F0A6C8"></path></svg></sc-if>
<sc-if value="{{s3}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 300 220" width="300" height="220"><g transform="translate(150 110)"><circle r="62" fill="rgba(185,222,92,.08)" stroke="#B9DE5C" stroke-width="4"></circle><circle r="48" fill="none" stroke="#B9DE5C" stroke-width="1.5" stroke-dasharray="3 5" opacity=".6"></circle><path d="M-26 22 L-6 -18 L6 2 L14 -8 L30 22z" fill="none" stroke="#E9C35B" stroke-width="5" stroke-linejoin="round"></path></g><g transform="translate(58 70) rotate(-10)"><rect x="-22" y="-22" width="44" height="44" rx="10" fill="#B9DE5C"></rect><path d="M-8 -10 h16 v14 h-16z M-8 -2 h16 M-4 8 l-3 4 M4 8 l3 4" stroke="#131512" stroke-width="2.5" fill="none" stroke-linecap="round"></path></g><g transform="translate(248 160) rotate(8)"><rect x="-20" y="-20" width="40" height="40" rx="10" fill="#26302A" stroke="#31362F" stroke-width="2"></rect><path d="M-10 6 h20 l-4 6 h-12z M0 -12 v18 M0 -10 l8 10 h-8" stroke="#9CA295" stroke-width="2.4" fill="none" stroke-linejoin="round"></path></g></svg></sc-if>
</div>
<div style="position: absolute; left: 24px; right: 24px; top: 350px; display: flex; flex-direction: column; gap: 12px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; color: var(--act)">{{kicker}}</span>
<h1 style="margin: 0; font-size: 30px; line-height: 1.08; font-weight: 800; font-stretch: 110%">{{title}}</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: var(--mu)">{{text}}</p>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px">
<sc-for list="{{points}}" as="p" hint-placeholder-count="3">
<div style="display: flex; gap: 10px; align-items: flex-start"><span style="color: var(--act); font-weight: 800">·</span><span style="font-size: 14px; line-height: 1.45">{{p.t}}</span></div>
</sc-for>
</div>
</div>
<div style="position: absolute; left: 24px; right: 24px; bottom: 34px; display: flex; flex-direction: column; gap: 18px; align-items: center">
<div style="display: flex; gap: 6px"><sc-for list="{{dots}}" as="d" hint-placeholder-count="4"><span style="{{d.style}}"></span></sc-for></div>
<sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{next}}" style="width: 100%; height: 50px; border: 0; border-radius: 999px; background: var(--ac); color: var(--on); font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Next</button></sc-if>
<sc-if value="{{isLast}}" hint-placeholder-val="{{ false }}"><a href="Pledge.dc.html" style="width: 100%; height: 50px; border-radius: 999px; background: var(--ac); color: var(--on); text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Begin the initiation</a></sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"slide":{"editor":"enum","options":["0","1","2","3"],"default":"0"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { i: props.slide ? +props.slide : 0 }; }
renderVals() {
var self = this;
var s = this.state;
var P = this.props;
function chip(on) { return 'min-height: 40px; padding: 0 14px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'border: 1px solid var(--ac); background: var(--ac); color: var(--on);' : 'border: 1px solid var(--ln); background: var(--sf); color: var(--tx);'); }
var V = {};

var S = [
['1 OF 4 · EXPLORE', 'Routes real people actually took.', 'Not ads, not listicles. Day-by-day routes from travellers, chill to epic.', ['Search by place, vibe, effort and month', 'Save the ones you love for someday', 'Steal a route and make it your own']],
['2 OF 4 · BUILD', 'Build your trip one day at a time.', 'Add each day live as you go, or after the trip from your photos.', ['Live sharing is off until you turn it on', 'Exact dates stay private, people only see the month', 'Works offline when there\'s no signal']],
['3 OF 4 · HELP EACH OTHER', 'We\'re all here to travel better.', 'Every route gets better when people who went pitch in.', ['Ask and answer on Campfire', 'Post updates when something changed', 'Fill in the Must-know so the next person doesn\'t have to ask']],
['4 OF 4 · GO FURTHER', 'Take on a sidequest.', 'Every week we drop a new dare. Do it, post it, inspire someone else to go.', ['Done it before? Ages ago still counts', 'See how the whole community took on the same dare', 'The best stories get featured on Explore']]
];
var i = s.i, c = S[i];
V.step = c[0]; V.kicker = c[0].split(' · ')[1]; V.title = c[1]; V.text = c[2];
V.points = c[3].map(function (t) { return { t: t }; });
V.s0 = i === 0; V.s1 = i === 1; V.s2 = i === 2; V.s3 = i === 3;
V.isLast = i === 3; V.notLast = i < 3;
V.dots = S.map(function (_, j) { return { style: 'height: 8px; border-radius: 999px; width: ' + (j === i ? 22 : 8) + 'px; background: ' + (j === i ? 'var(--act)' : 'var(--ln)') + ';' }; });
V.next = function () { self.setState({ i: Math.min(3, i + 1) }); };
V.swDown = function (e) { self.sx = e.clientX; };
V.swUp = function (e) { if (self.sx == null) return; var dx = e.clientX - self.sx; self.sx = null; if (dx < -40) self.setState({ i: Math.min(3, i + 1) }); else if (dx > 40) self.setState({ i: Math.max(0, i - 1) }); };

V.rootStyle = 'width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Archivo, sans-serif; background: var(--bg); color: var(--tx); --bg: #131512; --sf: #1C1F1B; --sf2: #262A24; --ln: #31362F; --tx: #E6E8E1; --mu: #9CA295; --ac: #B9DE5C; --on: #131512; --act: #B9DE5C; --info: #8FB9E6; --warn: #F0B45A; --danger: #F08A7E; --map: #253126; --cnt: #34453A; --rt: #B9DE5C; --ph1: #3A4838; --ph2: #4A3F35; --ph3: #35434C; --ph4: #4A4652; --scrim: rgba(19,21,18,0.78); --ring: #000;';
return V;
}
}
</script>
</body>
</html>
